name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Proje klasorunu bul
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "HATA: settings.gradle repoda yok. Dosyalar yuklenmemis veya zip olarak yuklenmis."
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV
      - run: gradle build --no-daemon -p "$PROJECT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: nursultan-client
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
